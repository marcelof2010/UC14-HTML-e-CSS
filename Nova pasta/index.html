<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <link rel="stylesheet" href="tarefa.css">
    <title>Document</title>
</head>
<body>
    <div class="container">

        <h1 id="titulo">Meu Planejador de Estudos</h1>

        <h2>Nova tarefa</h2>


        <input type="text" id="tarefa" placeholder="Digite o nome da tarefa">

        <input type="text" id="materia" placeholder="Digite a materia">

        <select id="prioridade">
        <option value="Alta">Alta</option>
        <option value="Media">Media</option>
        <option value="Baixa">Baixa</option>

        </select>

        <button onclick="adicionarTarefa()">
            Cadastrar tarefa
        </button>

        <button onclick="limparCampos()">
            Limpar campos
        </button>

        <p id="mensagem"></p>

        <div class="contadores"></div>

        <p id="contador"> Tarefas cadastradas: 0</p>
        <p id="contadorConcluidas">Tarefas concluídas: 0</p>
    
        <script src="tarefa.js"></script>
    </div>
</body>
</html>
